<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Zhang Zhang Navigation</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
	    <div id="navbar">
	        <h1>Navigation Bar</h1>
	    </div>
	    <div id="main-content">
	        <div id="main-content">
			    <div class="sidebar">
			        <h3>Sidebar Navigation</h3>
			    </div>
			    <div class="content">
			        <h3>Main Content</h3>
			        <button id="changeColorBtn">Change Header Color</button>
			    </div>
			</div>
			<script>
document
    .getElementById("changeColorBtn")
    .addEventListener("click", function() {

        document
            .querySelector("#navbar h1")
            .style
            .color = "green";
            document
            .querySelector(".content")
            .innerHTML = "<p>New content added!</p>";
});
</script>
	</body>
</html>
