<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7f7f5">

  <title>Adaptive — Shoe Control</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="phone">

    <header>
      <span class="brand">ADAPTIVE</span>

      <button
        id="battery"
        class="battery-button"
        aria-label="Simulate charging"
      >
        <span>82%</span>

        <span class="battery">
          <span></span>
        </span>

        <span id="bolt" hidden>ϟ</span>
      </button>
    </header>

    <section class="intro">
      <p class="eyebrow">YOUR SUPPORT, YOUR WAY</p>
      <h1>Make your<br>next move.</h1>
    </section>

    <section class="selection" aria-label="Select shoe">
      <button
        class="shoe selected"
        data-side="L"
        aria-pressed="true"
      >
        <span class="arrow">↑</span>
        <strong>L</strong>
        <span class="shoe-name">LEFT SHOE</span>
        <span class="shoe-summary" id="summaryL"></span>
      </button>

      <button
        class="shoe"
        data-side="R"
        aria-pressed="false"
      >
        <span class="arrow">↑</span>
        <strong>R</strong>
        <span class="shoe-name">RIGHT SHOE</span>
        <span class="shoe-summary" id="summaryR"></span>
      </button>
    </section>

    <p class="hint">Swipe up or tap to select a shoe</p>

    <section class="controls" aria-labelledby="controlTitle">

      <div class="section-heading">
        <h2 id="controlTitle">Left shoe</h2>
        <span id="status" role="status">Ready</span>
      </div>

      <label class="slider-label" for="arch">
        <span>Arch support</span>
        <output id="archValue" for="arch">50%</output>
      </label>

      <input
        id="arch"
        type="range"
        min="0"
        max="100"
        value="50"
      >

      <div class="endpoints">
        <span>Low</span>
        <span>High</span>
      </div>

      <label class="slider-label second" for="cushion">
        <span>Cushioning</span>
        <output id="cushionValue" for="cushion">50%</output>
      </label>

      <p class="detail">Carbon plate adjustment</p>

      <input
        id="cushion"
        type="range"
        min="0"
        max="100"
        value="50"
      >

      <div class="endpoints">
        <span>Soft</span>
        <span>Firm</span>
      </div>

      <div class="mode-heading">
        <h2>Mode</h2>
        <span>Selected shoe</span>
      </div>

      <div
        class="modes"
        role="group"
        aria-label="Activity mode"
      >
        <button data-mode="Walk" aria-pressed="false">
          Walk
        </button>

        <button data-mode="Run" aria-pressed="false">
          Run
        </button>

        <button data-mode="Court" aria-pressed="false">
          Court
        </button>
      </div>
    </section>

    <footer>
      <span class="dot"></span>
      Interface demo
      <span class="footer-right">L / R independent</span>
    </footer>

    <div class="home-indicator" aria-hidden="true"></div>

    <aside
      id="chargingPopup"
      class="charging-popup"
      role="status"
      hidden
    >
      <span class="large-battery">ϟ</span>
      <h2>82% Charged</h2>
      <p>Charging connected</p>
    </aside>

  </main>
</body>
</html>
