<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#f3f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Adaptive Shoe</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
  background: #d8d8d4;
}

body {
  margin: 0;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
}

button {
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
.zone:focus-visible {
  outline: 2px solid #777;
  outline-offset: -4px;
}

[hidden] {
  display: none !important;
}

.app {
  width: 390px;
  height: 844px;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: #f3f3ef;
  border-radius: 36px;
  outline: 7px solid #292929;
}

/* Phone status bar */
.statusbar {
  height: 59px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 19px 27px 10px;
  font-size: 12px;
  font-weight: 600;
}

.notch {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 88px;
  height: 23px;
  border-radius: 20px;
  background: #292929;
}

.signal {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}

.signal i {
  width: 3px;
  background: #444;
  border-radius: 1px;
}

.signal i:nth-child(1) { height: 4px; }
.signal i:nth-child(2) { height: 6px; }
.signal i:nth-child(3) { height: 9px; }
.signal i:nth-child(4) { height: 12px; }

/* Independent gesture areas */
.zones {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin: 17px 16px 0;
}

.zone {
  position: relative;
  min-width: 0;
  border-radius: 22px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  transition: background 0.15s;
}

.zone.selected {
  background: #eaeae4;
}

.zone.dragging {
  cursor: grabbing;
  background: #e2e2da;
}

.zone:first-child::after {
  content: "";
  position: absolute;
  right: 0;
  top: 28px;
  bottom: 28px;
  width: 1px;
  background: #cecec5;
}

/* Arch height is represented by letter movement */
.letter-stage {
  position: absolute;
  inset: 30px 0 85px;
  display: grid;
  place-items: center;
  pointer-events: none;
}

.letter {
  display: block;
  font-size: 142px;
  font-weight: 700;
  font-style: italic;
  line-height: 1;
  letter-spacing: -10px;
  padding-right: 12px;
  transform: translateY(var(--offset, 0px));
  transition: transform 0.16s ease;
}

.dragging .letter {
  transition: none;
}

/* Cushion firmness is represented by filled dots */
.dots {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 39px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  pointer-events: none;
}

.dot {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: #cecec4;
  transition: background 0.12s;
}

.dot.on {
  background: #343434;
}

/* Bottom controls */
.bottom-bar {
  display: flex;
  justify-content: center;
  gap: 33px;
  padding: 26px 20px 16px;
  flex-shrink: 0;
}

.nav-button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: 0;
  background: none;
  color: #75756b;
  font-size: 9px;
}

.nav-icon {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #e1e1d8;
  color: #333;
  font-size: 22px;
}

.nav-button.active .nav-icon {
  background: #333;
  color: white;
}

/* Battery and charging at the bottom */
.battery-row {
  display: flex;
  justify-content: center;
  flex-shrink: 0;
  padding: 0 20px 33px;
}

.battery-button {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 15px;
  border: 0;
  background: transparent;
  color: #77776d;
  font-size: 10px;
}

.battery {
  width: 24px;
  height: 12px;
  position: relative;
  padding: 2px;
  border: 1px solid #666;
  border-radius: 3px;
}

.battery::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: #666;
}

.battery span {
  display: block;
  width: 82%;
  height: 100%;
  background: #666;
}

#bolt {
  font-size: 18px;
  color: #333;
}

/* Brief gesture feedback */
.toast {
  position: absolute;
  bottom: 170px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 90%;
  white-space: nowrap;
  padding: 9px 15px;
  border-radius: 20px;
  background: #333;
  color: white;
  font-size: 10px;
  pointer-events: none;
  z-index: 5;
}

/* Bottom sheets */
.sheet-layer {
  position: absolute;
  inset: 0;
  z-index: 15;
}

.scrim {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #00000030;
}

.sheet {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 85%;
  overflow-y: auto;
  padding: 12px 25px 42px;
  background: #f3f3ef;
  border-radius: 27px 27px 0 0;
  animation: sheet-in 0.25s ease;
}

.handle {
  width: 38px;
  height: 4px;
  margin: 0 auto 25px;
  border-radius: 4px;
  background: #c2c2b8;
}

.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h2 {
  margin: 0;
  font-size: 24px;
  font-weight: 500;
}

.close {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: #e0e0d8;
  color: #666;
  font-size: 23px;
}

.sheet-caption {
  margin: 13px 0 22px;
  font-size: 11px;
  line-height: 1.6;
  color: #818178;
}

.side-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 21px;
}

.side-tabs button {
  flex: 1;
  padding: 12px;
  border: 1px solid #cecec3;
  border-radius: 22px;
  background: transparent;
  font-size: 11px;
}

.side-tabs button[aria-pressed="true"] {
  background: #333;
  color: white;
  border-color: #333;
}

.mode-list {
  display: grid;
  gap: 11px;
}

.mode-option {
  min-height: 69px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  border: 1px solid #d4d4ca;
  border-radius: 16px;
  background: #e9e9e2;
  color: #333;
  text-align: left;
}

.mode-option[aria-pressed="true"] {
  border: 2px solid #333;
  padding: 15px;
}

.mode-option strong {
  font-size: 14px;
  font-weight: 500;
}

.mode-option span {
  font-size: 10px;
  color: #818178;
}

.adjust-row {
  padding: 18px 0;
  border-bottom: 1px solid #d8d8ce;
}

.adjust-heading {
  display: flex;
  justify-content: space-between;
  margin-bottom: 13px;
  font-size: 13px;
}

.stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stepper button {
  width: 48px;
  height: 44px;
  border: 1px solid #c9c9be;
  border-radius: 12px;
  background: #e9e9e2;
  font-size: 24px;
}

.stepper span {
  font-size: 10px;
  color: #85857b;
}

.reset {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: 1px solid #c9c9be;
  border-radius: 12px;
  background: transparent;
  font-size: 12px;
}

.sheet-feedback {
  min-height: 18px;
  margin: 18px 0 0;
  text-align: center;
  font-size: 10px;
  color: #77776d;
}

/* Charging animation */
.charging-overlay {
  position: absolute;
  inset: 0;
  z-index: 25;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #f3f3eff7;
  pointer-events: none;
}

.large-battery {
  width: 116px;
  height: 60px;
  position: relative;
  padding: 5px;
  margin-bottom: 27px;
  border: 2px solid #333;
  border-radius: 11px;
}

.large-battery::after {
  content: "";
  position: absolute;
  right: -8px;
  top: 18px;
  width: 5px;
  height: 20px;
  border-radius: 2px;
  background: #333;
}

.large-battery span {
  display: grid;
  place-items: center;
  width: 82%;
  height: 100%;
  border-radius: 5px;
  background: #555;
  color: white;
  font-size: 34px;
}

.charging-overlay p {
  font-size: 12px;
  color: #888;
}

.home-indicator {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 4px;
  border-radius: 5px;
  background: #333;
  z-index: 30;
}

@keyframes sheet-in {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

@media (max-width: 450px) {
  body {
    display: block;
    padding: 0;
    background: #f3f3ef;
  }

  .app {
    width: 100%;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    border-radius: 0;
    outline: none;
  }

  .notch {
    display: none;
  }

  .battery-row {
    padding-bottom: max(33px, env(safe-area-inset-bottom));
  }
}

@media (max-width: 350px) {
  .letter {
    font-size: 118px;
  }

  .dots {
    gap: 4px;
  }

  .dot {
    width: 6px;
    height: 6px;
    flex-basis: 6px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<main class="app">

  <div class="statusbar">
    <span>9:41</span>
    <span class="notch" aria-hidden="true"></span>
    <span class="signal" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </span>
  </div>

  <section class="zones" aria-label="Independent shoe controls">

    <article
      class="zone selected"
      data-side="L"
      tabindex="0"
      aria-label="Left shoe. Swipe up or down to adjust arch height. Swipe left or right to adjust cushion firmness."
    >
      <div class="letter-stage" aria-hidden="true">
        <span id="letterL" class="letter">L</span>
      </div>

      <div id="dotsL" class="dots" aria-hidden="true"></div>
    </article>

    <article
      class="zone"
      data-side="R"
      tabindex="0"
      aria-label="Right shoe. Swipe up or down to adjust arch height. Swipe left or right to adjust cushion firmness."
    >
      <div class="letter-stage" aria-hidden="true">
        <span id="letterR" class="letter">R</span>
      </div>

      <div id="dotsR" class="dots" aria-hidden="true"></div>
    </article>

  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <nav class="bottom-bar" aria-label="Shoe controls">
    <button id="controlButton" class="nav-button active">
      <span class="nav-icon" aria-hidden="true">↕</span>
      <span>Control</span>
    </button>

    <button id="modeButton" class="nav-button">
      <span class="nav-icon" aria-hidden="true">≡</span>
      <span>Mode</span>
    </button>

    <button id="adjustButton" class="nav-button">
      <span class="nav-icon" aria-hidden="true">±</span>
      <span>Fine tune</span>
    </button>
  </nav>

  <div class="battery-row">
    <button
      id="batteryButton"
      class="battery-button"
      aria-label="82 percent battery. Tap to simulate charging."
    >
      <span class="battery" aria-hidden="true"><span></span></span>
      <span>82%</span>
      <span id="bolt" hidden>ϟ</span>
    </button>
  </div>

  <div id="sheetLayer" class="sheet-layer" hidden>
    <button
      id="scrim"
      class="scrim"
      aria-label="Close panel"
      tabindex="-1"
    ></button>

    <section
      class="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheetTitle"
    >
      <div class="handle" aria-hidden="true"></div>

      <div class="sheet-header">
        <h2 id="sheetTitle">Your modes</h2>
        <button id="closeSheet" class="close" aria-label="Close">×</button>
      </div>

      <p id="sheetCaption" class="sheet-caption">
        Choose a preset for the selected shoe.
      </p>

      <div class="side-tabs" role="group" aria-label="Select shoe">
        <button data-select="L" aria-pressed="true">Left shoe</button>
        <button data-select="R" aria-pressed="false">Right shoe</button>
      </div>

      <div id="modePanel" class="mode-list">
        <button class="mode-option" data-mode="Walk" aria-pressed="false">
          <strong>Walk</strong>
          <span>Arch 40 · Firmness 25</span>
        </button>

        <button class="mode-option" data-mode="Run" aria-pressed="false">
          <strong>Run</strong>
          <span>Arch 60 · Firmness 50</span>
        </button>

        <button class="mode-option" data-mode="Court" aria-pressed="false">
          <strong>Court</strong>
          <span>Arch 75 · Firmness 80</span>
        </button>
      </div>

      <div id="adjustPanel" hidden>
        <div class="adjust-row">
          <div class="adjust-heading">
            <span>Arch height</span>
            <output id="fineArch">50%</output>
          </div>

          <div class="stepper">
            <button data-metric="arch" data-step="-5"
                    aria-label="Lower arch">−</button>
            <span>Low / High</span>
            <button data-metric="arch" data-step="5"
                    aria-label="Raise arch">+</button>
          </div>
        </div>

        <div class="adjust-row">
          <div class="adjust-heading">
            <span>Cushioning</span>
            <output id="fineFirmness">50%</output>
          </div>

          <div class="stepper">
            <button data-metric="firmness" data-step="-5"
                    aria-label="Soften cushioning">−</button>
            <span>Carbon plate firmness</span>
            <button data-metric="firmness" data-step="5"
                    aria-label="Firm cushioning">+</button>
          </div>
        </div>

        <button id="resetButton" class="reset">
          Reset selected shoe
        </button>
      </div>

      <p id="sheetFeedback" class="sheet-feedback" role="status">
        Left shoe selected
      </p>
    </section>
  </div>

  <aside id="chargingOverlay" class="charging-overlay" role="status" hidden>
    <div class="large-battery"><span>ϟ</span></div>
    <h2>82% Charged</h2>
    <p>Charging</p>
  </aside>

  <div class="home-indicator" aria-hidden="true"></div>

</main>

<script>
"use strict";

// Interface demonstration targets, not hardware measurements.
const state = {
  L: { arch: 50, firmness: 50, mode: null },
  R: { arch: 50, firmness: 50, mode: null }
};

const presets = {
  Walk: { arch: 40, firmness: 25 },
  Run: { arch: 60, firmness: 50 },
  Court: { arch: 75, firmness: 80 }
};

const get = id => document.getElementById(id);
const zones = [...document.querySelectorAll(".zone")];
const modeOptions = [...document.querySelectorAll("[data-mode]")];
const sideTabs = [...document.querySelectorAll("[data-select]")];

let selected = "L";
let charging = false;
let chargingTimer;
let toastTimer;
let returnFocus = null;

// Create 10 dots for each shoe.
for (const side of ["L", "R"]) {
  for (let index = 0; index < 10; index++) {
    const dot = document.createElement("span");
    dot.className = "dot";
    get("dots" + side).appendChild(dot);
  }
}

function clamp(value) {
  return Math.max(0, Math.min(100, Math.round(value)));
}

function sideName(side) {
  return side === "L" ? "Left" : "Right";
}

function announce(message, showToast = true) {
  get("sheetFeedback").textContent = message;

  if (!showToast || !get("sheetLayer").hidden) return;

  clearTimeout(toastTimer);
  get("toast").textContent = message;
  get("toast").hidden = false;

  toastTimer = setTimeout(() => {
    get("toast").hidden = true;
  }, 1100);
}

function render() {
  for (const side of ["L", "R"]) {
    const shoe = state[side];

    // Low arch = letter moves down.
    // High arch = letter moves up.
    // Movement is limited to -18px / +18px.
    const offset = (50 - shoe.arch) * 0.36;
    get("letter" + side).style.setProperty(
      "--offset",
      offset + "px"
    );

    // Each filled dot represents approximately 10% firmness.
    const activeDots = Math.round(shoe.firmness / 10);

    [...get("dots" + side).children].forEach((dot, index) => {
      dot.classList.toggle("on", index < activeDots);
    });

    const zone = zones.find(item => item.dataset.side === side);

    zone.setAttribute(
      "aria-label",
      sideName(side) + " shoe. Arch height " + shoe.arch +
      " percent. Cushion firmness " + shoe.firmness +
      " percent. Swipe vertically for arch and horizontally for firmness."
    );
  }

  zones.forEach(zone => {
    zone.classList.toggle(
      "selected",
      zone.dataset.side === selected
    );
  });

  sideTabs.forEach(button => {
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.select === selected)
    );
  });

  modeOptions.forEach(button => {
    button.setAttribute(
      "aria-pressed",
      String(state[selected].mode === button.dataset.mode)
    );
  });

  get("fineArch").textContent = state[selected].arch + "%";
  get("fineFirmness").textContent = state[selected].firmness + "%";
}

function select(side) {
  selected = side;
  render();
  announce(sideName(side) + " shoe selected", false);
}

function adjust(side, metric, value) {
  const next = clamp(value);

  if (state[side][metric] === next) return;

  state[side][metric] = next;
  state[side].mode = null;

  render();

  announce(
    sideName(side) + " " +
    (metric === "arch" ? "arch" : "firmness") +
    " · " + next + "%"
  );
}

// Gesture direction locks after a clear initial movement.
zones.forEach(zone => {
  let gesture = null;

  zone.addEventListener("pointerdown", event => {
    if (!event.isPrimary || gesture) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;

    select(zone.dataset.side);

    gesture = {
      id: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      arch: state[selected].arch,
      firmness: state[selected].firmness,
      width: zone.clientWidth,
      height: zone.clientHeight,
      axis: null
    };

    zone.setPointerCapture(event.pointerId);
    zone.classList.add("dragging");
  });

  zone.addEventListener("pointermove", event => {
    if (!gesture || event.pointerId !== gesture.id) return;

    const dx = event.clientX - gesture.x;
    const dy = event.clientY - gesture.y;

    if (!gesture.axis) {
      if (Math.hypot(dx, dy) < 8) return;

      if (Math.abs(dy) > Math.abs(dx) * 1.2) {
        gesture.axis = "vertical";
      } else if (Math.abs(dx) > Math.abs(dy) * 1.2) {
        gesture.axis = "horizontal";
      } else {
        return;
      }
    }

    const side = zone.dataset.side;

    if (gesture.axis === "vertical") {
      adjust(
        side,
        "arch",
        gesture.arch - dy / gesture.height * 100
      );
    } else {
      adjust(
        side,
        "firmness",
        gesture.firmness + dx / gesture.width * 100
      );
    }
  });

  function finish(event) {
    if (!gesture || event.pointerId !== gesture.id) return;

    gesture = null;
    zone.classList.remove("dragging");

    if (zone.hasPointerCapture(event.pointerId)) {
      zone.releasePointerCapture(event.pointerId);
    }
  }

  zone.addEventListener("pointerup", finish);
  zone.addEventListener("pointercancel", finish);

  zone.addEventListener("lostpointercapture", () => {
    gesture = null;
    zone.classList.remove("dragging");
  });

  // Keyboard alternatives.
  zone.addEventListener("keydown", event => {
    const actions = {
      ArrowUp: ["arch", 5],
      ArrowDown: ["arch", -5],
      ArrowRight: ["firmness", 5],
      ArrowLeft: ["firmness", -5]
    };

    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      select(zone.dataset.side);
      return;
    }

    const action = actions[event.key];
    if (!action) return;

    event.preventDefault();
    select(zone.dataset.side);

    const [metric, step] = action;
    adjust(selected, metric, state[selected][metric] + step);
  });
});

// Bottom-sheet controls.
function setBackgroundInert(value) {
  document.querySelectorAll(
    ".statusbar, .zones, .bottom-bar, .battery-row"
  ).forEach(element => {
    element.inert = value;
  });
}

function openSheet(panel) {
  returnFocus = document.activeElement;
  const isMode = panel === "mode";

  clearTimeout(toastTimer);
  get("toast").hidden = true;

  get("sheetTitle").textContent =
    isMode ? "Your modes" : "Fine tune";

  get("sheetCaption").textContent = isMode
    ? "Choose a preset for the selected shoe."
    : "Adjust arch height and carbon plate firmness.";

  get("modePanel").hidden = !isMode;
  get("adjustPanel").hidden = isMode;

  render();
  announce(sideName(selected) + " shoe selected", false);

  get("sheetLayer").hidden = false;
  setBackgroundInert(true);
  get("closeSheet").focus();
}

function closeSheet() {
  get("sheetLayer").hidden = true;
  setBackgroundInert(false);

  if (returnFocus) returnFocus.focus();
}

get("modeButton").addEventListener(
  "click",
  () => openSheet("mode")
);

get("adjustButton").addEventListener(
  "click",
  () => openSheet("adjust")
);

get("controlButton").addEventListener("click", () => {
  announce(sideName(selected) + " shoe selected");
});

get("closeSheet").addEventListener("click", closeSheet);
get("scrim").addEventListener("click", closeSheet);

sideTabs.forEach(button => {
  button.addEventListener("click", () => {
    select(button.dataset.select);
  });
});

modeOptions.forEach(button => {
  button.addEventListener("click", () => {
    const mode = button.dataset.mode;

    Object.assign(state[selected], presets[mode], { mode });

    render();
    announce(sideName(selected) + " shoe · " + mode);
  });
});

document.querySelectorAll("[data-step]").forEach(button => {
  button.addEventListener("click", () => {
    const metric = button.dataset.metric;
    const step = Number(button.dataset.step);

    adjust(selected, metric, state[selected][metric] + step);
  });
});

get("resetButton").addEventListener("click", () => {
  Object.assign(state[selected], {
    arch: 50,
    firmness: 50,
    mode: null
  });

  render();
  announce(sideName(selected) + " shoe reset");
});

// Keyboard focus stays inside the open panel.
document.addEventListener("keydown", event => {
  if (get("sheetLayer").hidden) return;

  if (event.key === "Escape") {
    closeSheet();
    return;
  }

  if (event.key !== "Tab") return;

  const buttons = [
    ...document.querySelectorAll(".sheet button")
  ].filter(button => button.getClientRects().length > 0);

  const first = buttons[0];
  const last = buttons[buttons.length - 1];

  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

// Tap the bottom battery to simulate charging.
// Popup disappears after 2.2 seconds; the small bolt remains.
get("batteryButton").addEventListener("click", () => {
  charging = !charging;

  clearTimeout(chargingTimer);

  get("bolt").hidden = !charging;
  get("chargingOverlay").hidden = !charging;

  get("batteryButton").setAttribute(
    "aria-label",
    charging
      ? "Charging. Tap to simulate disconnection."
      : "82 percent battery. Tap to simulate charging."
  );

  if (charging) {
    chargingTimer = setTimeout(() => {
      get("chargingOverlay").hidden = true;
    }, 2200);
  }
});

render();
</script>
</body>
</html>
