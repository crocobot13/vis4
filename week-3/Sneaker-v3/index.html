<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Adaptive Shoe</title>

<style>
* { box-sizing: border-box; }

:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
  background: #d9d9d5;
}

body {
  margin: 0;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
}

button {
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
.zone:focus-visible {
  outline: 2px solid #777;
  outline-offset: -4px;
}

[hidden] { display: none !important; }

.app {
  width: 390px;
  height: 844px;
  max-width: 100%;
  position: relative;
  overflow: hidden;
  background: #f4f4f1;
  border-radius: 36px;
  outline: 7px solid #292929;
}

button, .caption {
  letter-spacing: 1px;
}

/* Status bar */
.statusbar {
  position: absolute;
  inset: 0 0 auto;
  height: 58px;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 19px 27px 10px;
  font-size: 11px;
  pointer-events: none;
}

.notch {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 88px;
  height: 23px;
  border-radius: 20px;
  background: #292929;
}

.signal {
  display: flex;
  align-items: flex-end;
  gap: 2px;
}

.signal i {
  width: 3px;
  background: #444;
}

.signal i:nth-child(1) { height: 4px; }
.signal i:nth-child(2) { height: 6px; }
.signal i:nth-child(3) { height: 9px; }
.signal i:nth-child(4) { height: 12px; }

/* Home */
.home {
  position: absolute;
  inset: 58px 0 0;
  display: flex;
  flex-direction: column;
}

.zones {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin: 17px 16px 0;
}

.zone {
  position: relative;
  min-width: 0;
  border-radius: 20px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  cursor: grab;
}

.zone.selected { background: #ebebe5; }
.zone.dragging { cursor: grabbing; }

.zone:first-child::after {
  content: "";
  position: absolute;
  right: 0;
  top: 28px;
  bottom: 28px;
  width: 1px;
  background: #cecec5;
  pointer-events: none;
}

/* The letter and circles move together with arch height */
.letter-stage {
  position: absolute;
  left: 50%;
  top: 43%;
  width: 0;
  height: 0;
  transform: translateY(var(--offset, 0px));
  transition: transform .16s ease;
  pointer-events: none;
}

.dragging .letter-stage { transition: none; }

.glyph {
  position: absolute;
  width: 88px;
  height: 140px;
  left: -44px;
  top: -70px;
  overflow: visible;
  z-index: 2;
}

.glyph path {
  fill: none;
  stroke: #292929;
}

/* Softness visualization */
.softness-visual {
  position: absolute;
  width: 240px;
  height: 240px;
  left: -120px;
  top: -120px;
  opacity: 0;
  transition: opacity .2s;
}

.zone.show-softness .softness-visual { opacity: 1; }

.rings {
  width: 240px;
  height: 240px;
  overflow: visible;
}

.reference-ring {
  fill: none;
  stroke: #555;
  stroke-opacity: .09;
  stroke-width: 1;
}

.active-ring {
  fill: none;
  stroke: #444;
  stroke-opacity: .55;
  stroke-width: 1.6;
}

.softness-number {
  position: absolute;
  left: 50%;
  transform: translate(-50%, -100%);
  padding: 4px 6px;
  background: #f4f4f1;
  border-radius: 5px;
  color: #444;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  text-align: center;
  white-space: nowrap;
}

.softness-number small {
  display: block;
  margin-bottom: 3px;
  font-size: 6px;
  letter-spacing: 1px;
  color: #888;
}

/* Hold this button to decrease softness */
.harden {
  position: absolute;
  left: 50%;
  bottom: 39px;
  transform: translateX(-50%);
  width: 44px;
  height: 44px;
  border: 1px solid #c6c6ba;
  border-radius: 50%;
  background: #f4f4f1;
  color: #777;
  font-size: 24px;
  line-height: 1;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  z-index: 5;
}

.zone.show-softness .harden,
.harden:focus-visible {
  opacity: 1;
  pointer-events: auto;
}

.harden:active {
  background: #dcdcd2;
  color: #222;
}

/* Arch ruler */
.ruler {
  position: absolute;
  top: 43%;
  left: 8px;
  transform: translateY(-50%);
  width: 32px;
  height: 204px;
  opacity: 0;
  pointer-events: none;
  z-index: 6;
}

.zone.show-ruler .ruler { opacity: 1; }

.ruler-line {
  position: absolute;
  left: 0;
  top: 2px;
  bottom: 2px;
  width: 1px;
  background: #bdbdb4;
}

.tick {
  position: absolute;
  left: 0;
  width: 6px;
  height: 1px;
  background: #aaa99f;
}

.tick.major { width: 11px; }

.tick span {
  position: absolute;
  left: 14px;
  top: -4px;
  font-size: 7px;
  color: #99998e;
}

.ruler-marker {
  position: absolute;
  left: -3px;
  width: 13px;
  height: 3px;
  background: #222;
  transform: translateY(50%);
}

.ruler-value {
  position: absolute;
  left: 13px;
  transform: translateY(50%);
  padding: 3px 4px;
  border-radius: 3px;
  background: #333;
  color: white;
  font-size: 10px;
}

/* Bottom controls */
.bottom-bar {
  display: flex;
  justify-content: center;
  gap: 31px;
  flex-shrink: 0;
  padding: 25px 20px 15px;
}

.nav-button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  border: 0;
  background: none;
  color: #77776d;
  font-size: 8px;
}

.nav-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #e2e2da;
  color: #333;
  font-size: 21px;
  letter-spacing: 0;
}

.nav-button.active .nav-icon {
  background: #333;
  color: white;
}

.battery-row {
  display: flex;
  justify-content: center;
  flex-shrink: 0;
  padding-bottom: 33px;
}

.battery-button {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 15px;
  border: 0;
  background: none;
  color: #77776d;
  font-size: 10px;
}

.small-battery {
  width: 24px;
  height: 12px;
  position: relative;
  padding: 2px;
  border: 1px solid #666;
  border-radius: 3px;
}

.small-battery::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: #666;
}

.small-battery span {
  display: block;
  width: 80%;
  height: 100%;
  background: #666;
}

#bolt { font-size: 18px; }

.toast {
  position: absolute;
  bottom: 168px;
  left: 50%;
  transform: translateX(-50%);
  padding: 9px 14px;
  border-radius: 20px;
  background: #333;
  color: white;
  font-size: 10px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 8;
}

/* Battery page */
.battery-screen {
  position: absolute;
  inset: 58px 0 0;
  z-index: 10;
  padding: 39px 28px 32px;
  display: flex;
  flex-direction: column;
  background: #f4f4f1;
}

h1, h2 {
  margin: 0;
  font-weight: 500;
  letter-spacing: .6px;
}

.battery-screen h1 { font-size: 23px; }

.caption {
  margin: 13px 0 0;
  font-size: 10px;
  line-height: 1.7;
  color: #85857b;
}

.battery-pair {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 51px;
}

.battery-column {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.shoe-label {
  margin-bottom: 22px;
  font-size: 12px;
  letter-spacing: 2px;
}

.large-battery {
  width: 66px;
  height: 154px;
  position: relative;
  border-radius: 10px;
  background: #d8d8d0;
}

.large-battery::before {
  content: "";
  position: absolute;
  top: -5px;
  left: 23px;
  width: 20px;
  height: 7px;
  border-radius: 3px 3px 0 0;
  background: #d8d8d0;
}

.battery-fill {
  position: absolute;
  inset: auto 0 0;
  background: #333;
  border-radius: 0 0 10px 10px;
}

.battery-percent {
  margin-top: 22px;
  font-size: 15px;
}

.battery-state {
  margin-top: 11px;
  font-size: 8px;
  letter-spacing: 1px;
  color: #85857b;
}

.charge-button,
.reset {
  padding: 15px;
  border: 1px solid #c9c9be;
  border-radius: 13px;
  background: transparent;
  font-size: 10px;
}

.demo-note {
  margin: 12px 0 20px;
  text-align: center;
  color: #96968a;
  font-size: 8px;
  letter-spacing: 1px;
}

.close-battery {
  align-self: center;
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  background: #e0e0d8;
  color: #555;
  font-size: 25px;
}

/* Bottom sheet */
.sheet-layer {
  position: absolute;
  inset: 0;
  z-index: 20;
}

.scrim {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #00000030;
}

.sheet {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 85%;
  overflow-y: auto;
  padding: 12px 25px 42px;
  border-radius: 27px 27px 0 0;
  background: #f4f4f1;
  animation: sheet-in .25s ease;
}

.handle {
  width: 38px;
  height: 4px;
  margin: 0 auto 25px;
  border-radius: 4px;
  background: #c2c2b8;
}

.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sheet h2 { font-size: 23px; }

.close {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: #e0e0d8;
  color: #666;
  font-size: 23px;
}

.sheet-caption {
  margin: 13px 0 22px;
  color: #818178;
  font-size: 10px;
  line-height: 1.6;
  letter-spacing: .6px;
}

.side-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 21px;
}

.side-tabs button {
  flex: 1;
  padding: 12px;
  border: 1px solid #cecec3;
  border-radius: 22px;
  background: transparent;
  font-size: 10px;
}

.side-tabs button[aria-pressed="true"] {
  background: #333;
  color: white;
  border-color: #333;
}

.mode-list {
  display: grid;
  gap: 11px;
}

.mode-option {
  min-height: 69px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px;
  border: 1px solid #d4d4ca;
  border-radius: 16px;
  background: #e9e9e2;
  text-align: left;
}

.mode-option[aria-pressed="true"] {
  border: 2px solid #333;
  padding: 14px;
}

.mode-option strong {
  font-size: 12px;
  font-weight: 500;
}

.mode-option span {
  font-size: 8px;
  letter-spacing: .4px;
  color: #818178;
}

.adjust-row {
  padding: 18px 0;
  border-bottom: 1px solid #d8d8ce;
}

.adjust-heading {
  display: flex;
  justify-content: space-between;
  margin-bottom: 13px;
  font-size: 12px;
}

.stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stepper button {
  width: 48px;
  height: 44px;
  border: 1px solid #c9c9be;
  border-radius: 12px;
  background: #e9e9e2;
  font-size: 23px;
}

.stepper span {
  font-size: 9px;
  color: #85857b;
}

.reset {
  width: 100%;
  margin-top: 22px;
}

.sheet-feedback {
  min-height: 18px;
  margin-top: 18px;
  text-align: center;
  font-size: 9px;
  color: #77776d;
}

/* Charging popup */
.charging-popup {
  position: absolute;
  inset: 0;
  z-index: 25;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #f4f4f1f5;
  pointer-events: none;
}

.charging-popup .symbol {
  font-size: 70px;
  margin-bottom: 20px;
}

.charging-popup p {
  font-size: 11px;
  color: #888;
}

.home-indicator {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 4px;
  border-radius: 5px;
  background: #333;
  z-index: 40;
}

@keyframes sheet-in {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

@media (max-width: 450px) {
  body {
    display: block;
    padding: 0;
    background: #f4f4f1;
  }

  .app {
    width: 100%;
    height: 100dvh;
    border-radius: 0;
    outline: none;
  }

  .notch { display: none; }

  .battery-row {
    padding-bottom: max(33px, env(safe-area-inset-bottom));
  }
}

@media (max-height: 650px) {
  .glyph {
    width: 70px;
    height: 110px;
    left: -35px;
    top: -55px;
  }

  .bottom-bar { padding-top: 12px; }
  .large-battery { height: 115px; }
  .battery-screen { padding-top: 20px; }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<main class="app">

  <div class="statusbar">
    <span>9:41</span>
    <span class="notch" aria-hidden="true"></span>
    <span class="signal" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </span>
  </div>

  <section id="home" class="home" aria-label="Shoe control">
    <div class="zones">

      <article class="zone selected" data-side="L"
               tabindex="0" aria-label="Left shoe">
        <div id="stageL" class="letter-stage">
          <div class="softness-visual" aria-hidden="true">
            <svg class="rings" viewBox="0 0 240 240">
              <circle class="reference-ring" cx="120" cy="120" r="52"/>
              <circle class="reference-ring" cx="120" cy="120" r="72"/>
              <circle class="reference-ring" cx="120" cy="120" r="92"/>
              <circle class="reference-ring" cx="120" cy="120" r="112"/>
              <circle id="ringL" class="active-ring"
                      cx="120" cy="120" r="82"/>
            </svg>
            <div id="softLabelL" class="softness-number">
              <small>SOFTNESS</small>
              <output id="softValueL">50</output>
            </div>
          </div>

          <svg class="glyph" viewBox="0 0 100 150" aria-hidden="true">
            <path id="pathL"></path>
          </svg>
        </div>

        <div id="rulerL" class="ruler" aria-hidden="true">
          <span class="ruler-line"></span>
          <span id="markerL" class="ruler-marker"></span>
          <span id="rulerValueL" class="ruler-value">50</span>
        </div>

        <button class="harden" data-harden="L"
                aria-label="Hold to decrease left shoe softness">×</button>
      </article>

      <article class="zone" data-side="R"
               tabindex="0" aria-label="Right shoe">
        <div id="stageR" class="letter-stage">
          <div class="softness-visual" aria-hidden="true">
            <svg class="rings" viewBox="0 0 240 240">
              <circle class="reference-ring" cx="120" cy="120" r="52"/>
              <circle class="reference-ring" cx="120" cy="120" r="72"/>
              <circle class="reference-ring" cx="120" cy="120" r="92"/>
              <circle class="reference-ring" cx="120" cy="120" r="112"/>
              <circle id="ringR" class="active-ring"
                      cx="120" cy="120" r="82"/>
            </svg>
            <div id="softLabelR" class="softness-number">
              <small>SOFTNESS</small>
              <output id="softValueR">50</output>
            </div>
          </div>

          <svg class="glyph" viewBox="0 0 100 150" aria-hidden="true">
            <path id="pathR"></path>
          </svg>
        </div>

        <div id="rulerR" class="ruler" aria-hidden="true">
          <span class="ruler-line"></span>
          <span id="markerR" class="ruler-marker"></span>
          <span id="rulerValueR" class="ruler-value">50</span>
        </div>

        <button class="harden" data-harden="R"
                aria-label="Hold to decrease right shoe softness">×</button>
      </article>

    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <nav class="bottom-bar" aria-label="Shoe controls">
      <button id="controlButton" class="nav-button active">
        <span class="nav-icon" aria-hidden="true">↕</span>
        <span>CONTROL</span>
      </button>

      <button id="modeButton" class="nav-button">
        <span class="nav-icon" aria-hidden="true">≡</span>
        <span>MODE</span>
      </button>

      <button id="adjustButton" class="nav-button">
        <span class="nav-icon" aria-hidden="true">±</span>
        <span>FINE TUNE</span>
      </button>
    </nav>

    <div class="battery-row">
      <button id="batteryButton" class="battery-button"
              aria-label="Open battery screen">
        <span class="small-battery" aria-hidden="true"><span></span></span>
        <span>80%</span>
        <span id="bolt" hidden>ϟ</span>
      </button>
    </div>
  </section>

  <section id="batteryScreen" class="battery-screen"
           aria-labelledby="batteryTitle" hidden>
    <h1 id="batteryTitle">Battery status</h1>
    <p id="batteryCaption" class="caption">Your shoes are ready to move.</p>

    <div class="battery-pair">
      <div class="battery-column">
        <span class="shoe-label">L</span>
        <div class="large-battery" aria-hidden="true">
          <div class="battery-fill" style="height:82%"></div>
        </div>
        <output class="battery-percent">82%</output>
        <span class="battery-state">READY</span>
      </div>

      <div class="battery-column">
        <span class="shoe-label">R</span>
        <div class="large-battery" aria-hidden="true">
          <div class="battery-fill" style="height:78%"></div>
        </div>
        <output class="battery-percent">78%</output>
        <span class="battery-state">READY</span>
      </div>
    </div>

    <button id="chargeButton" class="charge-button">SIMULATE CHARGING</button>
    <p class="demo-note">DEMO BATTERY VALUES</p>
    <button id="closeBattery" class="close-battery"
            aria-label="Close battery screen">×</button>
  </section>

  <div id="sheetLayer" class="sheet-layer" hidden>
    <button id="scrim" class="scrim" tabindex="-1"
            aria-label="Close panel"></button>

    <section class="sheet" role="dialog" aria-modal="true"
             aria-labelledby="sheetTitle">
      <div class="handle" aria-hidden="true"></div>

      <div class="sheet-header">
        <h2 id="sheetTitle">Your modes</h2>
        <button id="closeSheet" class="close" aria-label="Close">×</button>
      </div>

      <p id="sheetCaption" class="sheet-caption"></p>

      <div class="side-tabs" role="group" aria-label="Select shoe">
        <button data-select="L" aria-pressed="true">LEFT SHOE</button>
        <button data-select="R" aria-pressed="false">RIGHT SHOE</button>
      </div>

      <div id="modePanel" class="mode-list">
        <button class="mode-option" data-mode="Walk" aria-pressed="false">
          <strong>WALK</strong><span>ARCH 40 · SOFTNESS 75</span>
        </button>
        <button class="mode-option" data-mode="Run" aria-pressed="false">
          <strong>RUN</strong><span>ARCH 60 · SOFTNESS 50</span>
        </button>
        <button class="mode-option" data-mode="Court" aria-pressed="false">
          <strong>COURT</strong><span>ARCH 75 · SOFTNESS 20</span>
        </button>
      </div>

      <div id="adjustPanel" hidden>
        <div class="adjust-row">
          <div class="adjust-heading">
            <span>Arch height</span><output id="fineArch">50%</output>
          </div>
          <div class="stepper">
            <button data-metric="arch" data-step="-5"
                    aria-label="Lower arch">−</button>
            <span>LOW / HIGH</span>
            <button data-metric="arch" data-step="5"
                    aria-label="Raise arch">+</button>
          </div>
        </div>

        <div class="adjust-row">
          <div class="adjust-heading">
            <span>Softness</span><output id="fineSoftness">50%</output>
          </div>
          <div class="stepper">
            <button data-metric="softness" data-step="-5"
                    aria-label="Decrease softness">−</button>
            <span>LESS / MORE SOFT</span>
            <button data-metric="softness" data-step="5"
                    aria-label="Increase softness">+</button>
          </div>
        </div>

        <button id="resetButton" class="reset">RESET SELECTED SHOE</button>
      </div>

      <p id="sheetFeedback" class="sheet-feedback" role="status"></p>
    </section>
  </div>

  <aside id="chargingPopup" class="charging-popup" role="status" hidden>
    <span class="symbol">ϟ</span>
    <h2>Charging connected</h2>
    <p>LEFT + RIGHT</p>
  </aside>

  <div class="home-indicator" aria-hidden="true"></div>
</main>

<script>
"use strict";

const get = id => document.getElementById(id);
const zones = [...document.querySelectorAll(".zone")];

const state = {
  L: { arch: 50, softness: 50, mode: null },
  R: { arch: 50, softness: 50, mode: null }
};

const presets = {
  Walk: { arch: 40, softness: 75 },
  Run: { arch: 60, softness: 50 },
  Court: { arch: 75, softness: 20 }
};

let selected = "L";
let charging = false;
let toastTimer;
let popupTimer;
let returnFocus;

// Only one gesture / hold runs at a time.
let interaction = null;
let holdTimer = null;
let holdFrame = null;

const softTimers = { L: null, R: null };
const rulerTimers = { L: null, R: null };

function zoneFor(side) {
  return zones.find(zone => zone.dataset.side === side);
}

function clamp(value) {
  return Math.max(0, Math.min(100, Math.round(value)));
}

function sideName(side) {
  return side === "L" ? "Left" : "Right";
}

// Create ruler ticks.
for (const side of ["L", "R"]) {
  for (let value = 0; value <= 100; value += 5) {
    const tick = document.createElement("span");
    tick.className = "tick" + (value % 25 === 0 ? " major" : "");
    tick.style.bottom = (2 + value * 2) + "px";

    if (value % 25 === 0) {
      const label = document.createElement("span");
      label.textContent = value;
      tick.appendChild(label);
    }

    get("ruler" + side).appendChild(tick);
  }
}

function announce(message, showToast = true) {
  get("sheetFeedback").textContent = message;

  if (!showToast || !get("sheetLayer").hidden) return;

  clearTimeout(toastTimer);
  get("toast").textContent = message;
  get("toast").hidden = false;

  toastTimer = setTimeout(() => {
    get("toast").hidden = true;
  }, 1000);
}

function showSoftness(side, keepVisible = false) {
  clearTimeout(softTimers[side]);
  zoneFor(side).classList.add("show-softness");

  if (!keepVisible) {
    softTimers[side] = setTimeout(() => {
      const button = zoneFor(side).querySelector(".harden");

      // Keep the control visible while it has keyboard focus.
      if (document.activeElement !== button) {
        zoneFor(side).classList.remove("show-softness");
      }
    }, 2800);
  }
}

function showRuler(side, keepVisible = false) {
  clearTimeout(rulerTimers[side]);
  zoneFor(side).classList.add("show-ruler");

  if (!keepVisible) {
    rulerTimers[side] = setTimeout(() => {
      zoneFor(side).classList.remove("show-ruler");
    }, 900);
  }
}

function renderGlyph(side) {
  const softness = state[side].softness / 100;
  const radius = 2 + softness * 25;
  const path = get("path" + side);

  path.setAttribute("stroke-width", 8 + softness * 4);
  path.setAttribute("stroke-linecap", softness > .3 ? "round" : "butt");
  path.setAttribute("stroke-linejoin", softness > .3 ? "round" : "miter");

  if (side === "L") {
    path.setAttribute(
      "d",
      `M24 18 V${130 - radius} Q24 130 ${24 + radius} 130 H82`
    );
  } else {
    const corner = 3 + softness * 17;
    path.setAttribute(
      "d",
      `M23 132 V18 H57
       Q82 18 82 ${18 + corner}
       V${76 - corner}
       Q82 76 57 76 H23
       M53 76 L84 132`
    );
  }
}

function render() {
  for (const side of ["L", "R"]) {
    const shoe = state[side];
    const zone = zoneFor(side);

    get("stage" + side).style.setProperty(
      "--offset",
      (50 - shoe.arch) * 1.44 + "px"
    );

    renderGlyph(side);

    // Higher softness produces a larger ring.
    const radius = 52 + shoe.softness * .6;
    get("ring" + side).setAttribute("r", radius);

    get("softLabel" + side).style.top =
      (120 - radius - 5) + "px";

    get("softValue" + side).textContent = shoe.softness;

    const position = 2 + shoe.arch * 2;
    get("marker" + side).style.bottom = position + "px";
    get("rulerValue" + side).style.bottom = position + "px";
    get("rulerValue" + side).textContent = shoe.arch;

    zone.classList.toggle("selected", side === selected);

    zone.setAttribute(
      "aria-label",
      `${sideName(side)} shoe. Arch ${shoe.arch} percent.
       Softness ${shoe.softness} percent.
       Hold to increase softness. Swipe vertically to adjust arch.
       Arrow keys also adjust settings.`
    );
  }

  document.querySelectorAll("[data-select]").forEach(button => {
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.select === selected)
    );
  });

  document.querySelectorAll("[data-mode]").forEach(button => {
    button.setAttribute(
      "aria-pressed",
      String(state[selected].mode === button.dataset.mode)
    );
  });

  get("fineArch").textContent = state[selected].arch + "%";
  get("fineSoftness").textContent = state[selected].softness + "%";
}

function select(side) {
  selected = side;
  render();
  announce(sideName(side) + " shoe selected", false);
}

function adjust(side, metric, value, quiet = false) {
  const next = clamp(value);
  if (state[side][metric] === next) return;

  state[side][metric] = next;
  state[side].mode = null;
  render();

  if (!quiet) {
    announce(
      sideName(side) + " " +
      (metric === "arch" ? "arch" : "softness") +
      " · " + next + "%"
    );
  }
}

// Start continuous softness adjustment after a hold threshold.
function startHold(direction) {
  if (!interaction) return;

  interaction.kind = "hold";
  interaction.direction = direction;

  const side = interaction.side;
  const initial = state[side].softness;
  const started = performance.now();

  showSoftness(side, true);
  zoneFor(side).classList.remove("show-ruler");

  function frame(now) {
    if (!interaction || interaction.kind !== "hold") return;

    // Approximately 15 percentage points per second.
    const elapsed = (now - started) / 1000;
    adjust(side, "softness", initial + direction * elapsed * 15, true);

    holdFrame = requestAnimationFrame(frame);
  }

  holdFrame = requestAnimationFrame(frame);
}

function stopInteraction() {
  clearTimeout(holdTimer);
  cancelAnimationFrame(holdFrame);
  holdTimer = null;
  holdFrame = null;

  if (!interaction) return;

  const previous = interaction;
  interaction = null;

  zoneFor(previous.side).classList.remove("dragging");

  if (previous.element.hasPointerCapture(previous.id)) {
    previous.element.releasePointerCapture(previous.id);
  }

  if (previous.kind === "hold") {
    showSoftness(previous.side);
    announce(
      sideName(previous.side) + " softness · " +
      state[previous.side].softness + "%",
      false
    );
  }

  if (previous.kind === "arch") {
    showRuler(previous.side);
  }
}

// Pointer gestures on L / R.
zones.forEach(zone => {
  zone.addEventListener("contextmenu", event => event.preventDefault());

  zone.addEventListener("pointerdown", event => {
    if (event.target.closest("button")) return;
    if (interaction || !event.isPrimary) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;

    const side = zone.dataset.side;
    select(side);

    interaction = {
      id: event.pointerId,
      side,
      element: zone,
      x: event.clientX,
      y: event.clientY,
      initialArch: state[side].arch,
      height: zone.clientHeight,
      kind: "pending"
    };

    zone.setPointerCapture(event.pointerId);

    // Movement before this threshold cancels the long press.
    holdTimer = setTimeout(() => startHold(1), 420);
  });

  zone.addEventListener("pointermove", event => {
    if (!interaction || interaction.element !== zone) return;
    if (interaction.id !== event.pointerId) return;
    if (interaction.kind === "hold") return;

    const dx = event.clientX - interaction.x;
    const dy = event.clientY - interaction.y;

    if (interaction.kind === "pending" && Math.hypot(dx, dy) > 8) {
      clearTimeout(holdTimer);

      if (Math.abs(dy) > Math.abs(dx) * 1.2) {
        interaction.kind = "arch";
        zone.classList.add("dragging");
        zone.classList.remove("show-softness");
      } else if (Math.abs(dx) > Math.abs(dy) * 1.2) {
        // Horizontal movement does not change cushion settings.
        interaction.kind = "cancelled";
      }
    }

    if (interaction.kind === "arch") {
      showRuler(interaction.side, true);
      adjust(
        interaction.side,
        "arch",
        interaction.initialArch - dy / interaction.height * 100
      );
    }
  });

  zone.addEventListener("pointerup", event => {
    if (interaction?.element === zone && interaction.id === event.pointerId) {
      stopInteraction();
    }
  });

  zone.addEventListener("pointercancel", event => {
    if (interaction?.element === zone && interaction.id === event.pointerId) {
      stopInteraction();
    }
  });

  zone.addEventListener("lostpointercapture", () => {
    if (interaction?.element === zone) stopInteraction();
  });

  // Keyboard alternative.
  zone.addEventListener("keydown", event => {
    if (event.target !== zone) return;

    const actions = {
      ArrowUp: ["arch", 5],
      ArrowDown: ["arch", -5],
      ArrowRight: ["softness", 5],
      ArrowLeft: ["softness", -5]
    };

    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      select(zone.dataset.side);
      showSoftness(zone.dataset.side);
      return;
    }

    const action = actions[event.key];
    if (!action) return;

    event.preventDefault();
    select(zone.dataset.side);

    const [metric, step] = action;
    adjust(selected, metric, state[selected][metric] + step);

    if (metric === "arch") showRuler(selected);
    else showSoftness(selected);
  });
});

// Hold × to continuously decrease softness.
document.querySelectorAll("[data-harden]").forEach(button => {
  button.addEventListener("contextmenu", event => event.preventDefault());

  button.addEventListener("pointerdown", event => {
    if (interaction || !event.isPrimary) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;

    const side = button.dataset.harden;
    select(side);
    showSoftness(side, true);

    interaction = {
      id: event.pointerId,
      side,
      element: button,
      kind: "pending"
    };

    button.setPointerCapture(event.pointerId);
    holdTimer = setTimeout(() => startHold(-1), 300);
  });

  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    button.addEventListener(type, () => {
      if (interaction?.element === button) {
        const side = interaction.side;
        stopInteraction();
        showSoftness(side);
      }
    });
  }

  // Keyboard / assistive activation decreases softness by 5.
  button.addEventListener("click", event => {
    if (event.detail !== 0) return;

    const side = button.dataset.harden;
    select(side);
    adjust(side, "softness", state[side].softness - 5);
    showSoftness(side);
  });

  button.addEventListener("blur", () => {
    showSoftness(button.dataset.harden);
  });
});

// Stop all continuous changes when focus is lost.
window.addEventListener("blur", stopInteraction);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopInteraction();
});

// Mode / fine tune sheet.
function openSheet(panel) {
  stopInteraction();
  returnFocus = document.activeElement;

  const isMode = panel === "mode";
  get("toast").hidden = true;

  get("sheetTitle").textContent = isMode ? "Your modes" : "Fine tune";
  get("sheetCaption").textContent = isMode
    ? "Choose a preset for the selected shoe."
    : "Adjust arch height and cushion softness.";

  get("modePanel").hidden = !isMode;
  get("adjustPanel").hidden = isMode;

  render();
  announce(sideName(selected) + " shoe selected", false);

  get("sheetLayer").hidden = false;
  get("home").inert = true;
  get("closeSheet").focus();
}

function closeSheet() {
  get("sheetLayer").hidden = true;
  get("home").inert = false;
  if (returnFocus) returnFocus.focus();
}

get("modeButton").addEventListener("click", () => openSheet("mode"));
get("adjustButton").addEventListener("click", () => openSheet("adjust"));
get("closeSheet").addEventListener("click", closeSheet);
get("scrim").addEventListener("click", closeSheet);

get("controlButton").addEventListener("click", () => {
  showSoftness(selected);
});

document.querySelectorAll("[data-select]").forEach(button => {
  button.addEventListener("click", () => select(button.dataset.select));
});

document.querySelectorAll("[data-mode]").forEach(button => {
  button.addEventListener("click", () => {
    const mode = button.dataset.mode;
    Object.assign(state[selected], presets[mode], { mode });
    render();
    announce(sideName(selected) + " shoe · " + mode);
  });
});

document.querySelectorAll("[data-step]").forEach(button => {
  button.addEventListener("click", () => {
    const metric = button.dataset.metric;
    adjust(selected, metric,
      state[selected][metric] + Number(button.dataset.step));
  });
});

get("resetButton").addEventListener("click", () => {
  Object.assign(state[selected], {
    arch: 50,
    softness: 50,
    mode: null
  });
  render();
  announce(sideName(selected) + " shoe reset");
});

// Battery page. Values remain fixed for this demonstration.
function renderBattery() {
  get("bolt").hidden = !charging;
  get("batteryTitle").textContent =
    charging ? "Battery charging" : "Battery status";
  get("batteryCaption").textContent = charging
    ? "Your shoes are connected to power."
    : "Your shoes are ready to move.";
  get("chargeButton").textContent =
    charging ? "DISCONNECT CHARGER" : "SIMULATE CHARGING";

  document.querySelectorAll(".battery-state").forEach(label => {
    label.textContent = charging ? "CHARGING" : "READY";
  });
}

function closeBattery() {
  get("batteryScreen").hidden = true;
  get("home").hidden = false;
  get("batteryButton").focus();
}

get("batteryButton").addEventListener("click", () => {
  stopInteraction();
  get("toast").hidden = true;
  get("home").hidden = true;
  get("batteryScreen").hidden = false;
  renderBattery();
  get("closeBattery").focus();
});

get("closeBattery").addEventListener("click", closeBattery);

get("chargeButton").addEventListener("click", () => {
  charging = !charging;
  clearTimeout(popupTimer);
  renderBattery();

  get("chargingPopup").hidden = !charging;

  if (charging) {
    popupTimer = setTimeout(() => {
      get("chargingPopup").hidden = true;
    }, 2200);
  }
});

// Modal keyboard focus.
document.addEventListener("keydown", event => {
  if (!get("sheetLayer").hidden) {
    if (event.key === "Escape") {
      closeSheet();
      return;
    }

    if (event.key === "Tab") {
      const buttons = [...document.querySelectorAll(".sheet button")]
        .filter(button => button.getClientRects().length > 0);

      const first = buttons[0];
      const last = buttons[buttons.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  } else if (event.key === "Escape" && !get("batteryScreen").hidden) {
    closeBattery();
  }
});

render();
renderBattery();
</script>
</body>
</html>
