<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#f4f4f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Adaptive Shoe</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
  background: #d9d9d5;
  font-synthesis: none;
}

body {
  margin: 0;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
}

button {
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
.zone:focus-visible {
  outline: 2px solid #777;
  outline-offset: -4px;
}

[hidden] {
  display: none !important;
}

.app {
  width: 390px;
  height: 844px;
  max-width: 100%;
  position: relative;
  overflow: hidden;
  background: #f4f4f1;
  border-radius: 36px;
  outline: 7px solid #292929;
}

/* Typography inspired by the reference */
button,
.caption,
.nav-label,
.battery-button,
.side-tabs,
.mode-option,
.sheet-caption {
  letter-spacing: 1px;
}

.statusbar {
  position: absolute;
  inset: 0 0 auto;
  height: 58px;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 19px 27px 10px;
  font-size: 11px;
  letter-spacing: 0.5px;
  pointer-events: none;
}

.notch {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 88px;
  height: 23px;
  border-radius: 20px;
  background: #292929;
}

.signal {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}

.signal i {
  width: 3px;
  border-radius: 1px;
  background: #444;
}

.signal i:nth-child(1) { height: 4px; }
.signal i:nth-child(2) { height: 6px; }
.signal i:nth-child(3) { height: 9px; }
.signal i:nth-child(4) { height: 12px; }

/* Home screen */
.home {
  position: absolute;
  inset: 58px 0 0;
  display: flex;
  flex-direction: column;
}

.zones {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin: 17px 16px 0;
}

.zone {
  position: relative;
  min-width: 0;
  border-radius: 20px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  transition: background 0.15s;
}

.zone.selected {
  background: #ebebe5;
}

.zone.dragging {
  cursor: grabbing;
  background: #e3e3dc;
}

.zone:first-child::after {
  content: "";
  position: absolute;
  right: 0;
  top: 28px;
  bottom: 28px;
  width: 1px;
  background: #cecec5;
}

/* Moving and morphing L / R */
.letter-stage {
  position: absolute;
  inset: 20px 0 82px;
  display: grid;
  place-items: center;
  pointer-events: none;
}

.glyph {
  width: 100px;
  height: 154px;
  overflow: visible;
  transform: translateY(var(--offset, 0px));
  transition: transform 0.16s ease;
}

.glyph path {
  fill: none;
  stroke: #292929;
}

.zone.dragging .glyph {
  transition: none;
}

/* Cushion dots */
.dots {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 36px;
  display: flex;
  justify-content: center;
  gap: 5px;
  pointer-events: none;
}

.dot {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: #cecec4;
}

.dot.on {
  background: #343434;
}

/* Arch ruler, visible during vertical adjustment */
.ruler {
  position: absolute;
  top: 50%;
  left: 9px;
  transform: translateY(-50%);
  width: 32px;
  height: 204px;
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
  z-index: 3;
}

.zone.show-ruler .ruler {
  opacity: 1;
}

.ruler-line {
  position: absolute;
  left: 0;
  top: 2px;
  bottom: 2px;
  width: 1px;
  background: #bdbdb4;
}

.tick {
  position: absolute;
  left: 0;
  width: 6px;
  height: 1px;
  background: #aaa99f;
}

.tick.major {
  width: 11px;
}

.tick span {
  position: absolute;
  left: 14px;
  top: -4px;
  font-size: 7px;
  color: #9a998e;
  letter-spacing: 0;
}

.ruler-marker {
  position: absolute;
  left: -3px;
  width: 13px;
  height: 3px;
  background: #222;
  transform: translateY(50%);
}

.ruler-value {
  position: absolute;
  left: 13px;
  padding: 3px 4px;
  background: #333;
  color: white;
  border-radius: 3px;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  transform: translateY(50%);
}

/* Bottom navigation */
.bottom-bar {
  display: flex;
  justify-content: center;
  gap: 31px;
  flex-shrink: 0;
  padding: 25px 20px 15px;
}

.nav-button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  border: 0;
  background: none;
  color: #77776d;
  font-size: 8px;
}

.nav-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #e2e2da;
  color: #333;
  font-size: 21px;
  letter-spacing: 0;
}

.nav-button.active .nav-icon {
  background: #333;
  color: white;
}

.battery-row {
  display: flex;
  justify-content: center;
  flex-shrink: 0;
  padding-bottom: 33px;
}

.battery-button {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 15px;
  border: 0;
  background: none;
  color: #77776d;
  font-size: 10px;
}

.small-battery {
  width: 24px;
  height: 12px;
  position: relative;
  padding: 2px;
  border: 1px solid #666;
  border-radius: 3px;
}

.small-battery::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: #666;
}

.small-battery span {
  display: block;
  width: 80%;
  height: 100%;
  background: #666;
}

#bolt {
  font-size: 18px;
}

.toast {
  position: absolute;
  bottom: 171px;
  left: 50%;
  transform: translateX(-50%);
  padding: 9px 14px;
  border-radius: 20px;
  background: #333;
  color: white;
  font-size: 10px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 5;
}

/* Battery screen */
.battery-screen {
  position: absolute;
  inset: 58px 0 0;
  z-index: 10;
  padding: 39px 28px 32px;
  display: flex;
  flex-direction: column;
  background: #f4f4f1;
  animation: enter 0.25s ease;
}

h1,
h2 {
  margin: 0;
  font-weight: 500;
  letter-spacing: 0.6px;
}

.battery-screen h1 {
  font-size: 23px;
}

.caption {
  margin: 13px 0 0;
  font-size: 10px;
  line-height: 1.7;
  color: #85857b;
}

.battery-pair {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 51px;
}

.battery-column {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.shoe-label {
  margin-bottom: 22px;
  font-size: 12px;
  letter-spacing: 2px;
}

.large-battery {
  width: 66px;
  height: 154px;
  position: relative;
  border-radius: 10px;
  background: #d8d8d0;
}

.large-battery::before {
  content: "";
  position: absolute;
  top: -5px;
  left: 23px;
  width: 20px;
  height: 7px;
  border-radius: 3px 3px 0 0;
  background: #d8d8d0;
}

.battery-fill {
  position: absolute;
  inset: auto 0 0;
  background: #333;
  border-radius: 0 0 10px 10px;
}

.battery-percent {
  margin-top: 22px;
  font-size: 15px;
  letter-spacing: 1px;
}

.battery-state {
  margin-top: 11px;
  font-size: 8px;
  letter-spacing: 1px;
  color: #85857b;
}

.charge-button {
  padding: 15px;
  border: 1px solid #c9c9be;
  border-radius: 13px;
  background: transparent;
  font-size: 10px;
}

.demo-note {
  margin: 12px 0 20px;
  text-align: center;
  color: #96968a;
  font-size: 8px;
  letter-spacing: 1px;
}

.close-battery {
  align-self: center;
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  background: #e0e0d8;
  color: #555;
  font-size: 25px;
}

.charging .battery-fill {
  animation: pulse 1.3s ease-in-out infinite alternate;
}

/* Mode / fine tune sheet */
.sheet-layer {
  position: absolute;
  inset: 0;
  z-index: 20;
}

.scrim {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #00000030;
}

.sheet {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 85%;
  overflow-y: auto;
  padding: 12px 25px 42px;
  border-radius: 27px 27px 0 0;
  background: #f4f4f1;
  animation: sheet-in 0.25s ease;
}

.handle {
  width: 38px;
  height: 4px;
  margin: 0 auto 25px;
  border-radius: 4px;
  background: #c2c2b8;
}

.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sheet h2 {
  font-size: 23px;
}

.close {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: #e0e0d8;
  color: #666;
  font-size: 23px;
}

.sheet-caption {
  margin: 13px 0 22px;
  color: #818178;
  font-size: 10px;
  line-height: 1.6;
}

.side-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 21px;
}

.side-tabs button {
  flex: 1;
  padding: 12px;
  border: 1px solid #cecec3;
  border-radius: 22px;
  background: transparent;
  font-size: 10px;
}

.side-tabs button[aria-pressed="true"] {
  background: #333;
  color: white;
  border-color: #333;
}

.mode-list {
  display: grid;
  gap: 11px;
}

.mode-option {
  min-height: 69px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px;
  border: 1px solid #d4d4ca;
  border-radius: 16px;
  background: #e9e9e2;
  text-align: left;
}

.mode-option[aria-pressed="true"] {
  border: 2px solid #333;
  padding: 14px;
}

.mode-option strong {
  font-size: 12px;
  font-weight: 500;
}

.mode-option span {
  font-size: 8px;
  letter-spacing: 0.4px;
  color: #818178;
}

.adjust-row {
  padding: 18px 0;
  border-bottom: 1px solid #d8d8ce;
}

.adjust-heading {
  display: flex;
  justify-content: space-between;
  margin-bottom: 13px;
  font-size: 12px;
  letter-spacing: 0.5px;
}

.stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stepper button {
  width: 48px;
  height: 44px;
  border: 1px solid #c9c9be;
  border-radius: 12px;
  background: #e9e9e2;
  font-size: 23px;
}

.stepper span {
  font-size: 9px;
  color: #85857b;
}

.reset {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: 1px solid #c9c9be;
  border-radius: 12px;
  background: transparent;
  font-size: 10px;
}

.sheet-feedback {
  min-height: 18px;
  margin-top: 18px;
  text-align: center;
  font-size: 9px;
  color: #77776d;
}

/* Brief charger connection overlay */
.charging-popup {
  position: absolute;
  inset: 0;
  z-index: 25;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #f4f4f1f5;
  pointer-events: none;
}

.charging-popup .symbol {
  font-size: 70px;
  margin-bottom: 20px;
}

.charging-popup p {
  font-size: 11px;
  color: #888;
  letter-spacing: 1px;
}

.home-indicator {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 4px;
  border-radius: 5px;
  background: #333;
  z-index: 40;
}

@keyframes enter {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes sheet-in {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

@keyframes pulse {
  from { opacity: 0.65; }
  to { opacity: 1; }
}

@media (max-width: 450px) {
  body {
    display: block;
    padding: 0;
    background: #f4f4f1;
  }

  .app {
    width: 100%;
    height: 100dvh;
    border-radius: 0;
    outline: none;
  }

  .notch {
    display: none;
  }

  .statusbar {
    padding-top: max(19px, env(safe-area-inset-top));
  }

  .battery-row {
    padding-bottom: max(33px, env(safe-area-inset-bottom));
  }
}

@media (max-height: 650px) {
  .glyph {
    height: 120px;
    width: 78px;
  }

  .bottom-bar {
    padding-top: 12px;
  }

  .battery-screen {
    padding-top: 20px;
  }

  .large-battery {
    height: 115px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<main class="app">

  <div class="statusbar">
    <span>9:41</span>
    <span class="notch" aria-hidden="true"></span>
    <span class="signal" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </span>
  </div>

  <section id="home" class="home" aria-label="Shoe control">

    <div class="zones">

      <article
        class="zone selected"
        data-side="L"
        tabindex="0"
        aria-label="Left shoe"
      >
        <div class="letter-stage" aria-hidden="true">
          <svg id="letterL" class="glyph" viewBox="0 0 100 150">
            <path id="pathL"></path>
          </svg>
        </div>

        <div id="rulerL" class="ruler" aria-hidden="true">
          <span class="ruler-line"></span>
          <span id="markerL" class="ruler-marker"></span>
          <span id="rulerValueL" class="ruler-value">50</span>
        </div>

        <div id="dotsL" class="dots" aria-hidden="true"></div>
      </article>

      <article
        class="zone"
        data-side="R"
        tabindex="0"
        aria-label="Right shoe"
      >
        <div class="letter-stage" aria-hidden="true">
          <svg id="letterR" class="glyph" viewBox="0 0 100 150">
            <path id="pathR"></path>
          </svg>
        </div>

        <div id="rulerR" class="ruler" aria-hidden="true">
          <span class="ruler-line"></span>
          <span id="markerR" class="ruler-marker"></span>
          <span id="rulerValueR" class="ruler-value">50</span>
        </div>

        <div id="dotsR" class="dots" aria-hidden="true"></div>
      </article>

    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <nav class="bottom-bar" aria-label="Shoe controls">
      <button id="controlButton" class="nav-button active">
        <span class="nav-icon" aria-hidden="true">↕</span>
        <span class="nav-label">CONTROL</span>
      </button>

      <button id="modeButton" class="nav-button">
        <span class="nav-icon" aria-hidden="true">≡</span>
        <span class="nav-label">MODE</span>
      </button>

      <button id="adjustButton" class="nav-button">
        <span class="nav-icon" aria-hidden="true">±</span>
        <span class="nav-label">FINE TUNE</span>
      </button>
    </nav>

    <div class="battery-row">
      <button id="batteryButton" class="battery-button"
              aria-label="Open shoe battery screen">
        <span class="small-battery" aria-hidden="true">
          <span></span>
        </span>
        <span id="batterySummary">80%</span>
        <span id="bolt" hidden>ϟ</span>
      </button>
    </div>

  </section>

  <!-- Independent left and right battery display -->
  <section id="batteryScreen" class="battery-screen"
           aria-labelledby="batteryTitle" hidden>
    <h1 id="batteryTitle">Battery status</h1>
    <p id="batteryCaption" class="caption">
      Your shoes are ready to move.
    </p>

    <div class="battery-pair">
      <div class="battery-column">
        <span class="shoe-label">L</span>
        <div class="large-battery" aria-hidden="true">
          <div id="batteryFillL" class="battery-fill"></div>
        </div>
        <output id="batteryPercentL" class="battery-percent">82%</output>
        <span id="batteryStateL" class="battery-state">READY</span>
      </div>

      <div class="battery-column">
        <span class="shoe-label">R</span>
        <div class="large-battery" aria-hidden="true">
          <div id="batteryFillR" class="battery-fill"></div>
        </div>
        <output id="batteryPercentR" class="battery-percent">78%</output>
        <span id="batteryStateR" class="battery-state">READY</span>
      </div>
    </div>

    <button id="chargeButton" class="charge-button">
      SIMULATE CHARGING
    </button>

    <p class="demo-note">DEMO BATTERY VALUES</p>

    <button id="closeBattery" class="close-battery"
            aria-label="Close battery screen">×</button>
  </section>

  <!-- Mode and fine tune bottom sheet -->
  <div id="sheetLayer" class="sheet-layer" hidden>
    <button id="scrim" class="scrim"
            aria-label="Close panel" tabindex="-1"></button>

    <section class="sheet"
             role="dialog"
             aria-modal="true"
             aria-labelledby="sheetTitle">
      <div class="handle" aria-hidden="true"></div>

      <div class="sheet-header">
        <h2 id="sheetTitle">Your modes</h2>
        <button id="closeSheet" class="close" aria-label="Close">×</button>
      </div>

      <p id="sheetCaption" class="sheet-caption"></p>

      <div class="side-tabs" role="group" aria-label="Select shoe">
        <button data-select="L" aria-pressed="true">LEFT SHOE</button>
        <button data-select="R" aria-pressed="false">RIGHT SHOE</button>
      </div>

      <div id="modePanel" class="mode-list">
        <button class="mode-option" data-mode="Walk" aria-pressed="false">
          <strong>WALK</strong>
          <span>ARCH 40 · FIRMNESS 25</span>
        </button>
        <button class="mode-option" data-mode="Run" aria-pressed="false">
          <strong>RUN</strong>
          <span>ARCH 60 · FIRMNESS 50</span>
        </button>
        <button class="mode-option" data-mode="Court" aria-pressed="false">
          <strong>COURT</strong>
          <span>ARCH 75 · FIRMNESS 80</span>
        </button>
      </div>

      <div id="adjustPanel" hidden>
        <div class="adjust-row">
          <div class="adjust-heading">
            <span>Arch height</span>
            <output id="fineArch">50%</output>
          </div>
          <div class="stepper">
            <button data-metric="arch" data-step="-5"
                    aria-label="Lower arch">−</button>
            <span>LOW / HIGH</span>
            <button data-metric="arch" data-step="5"
                    aria-label="Raise arch">+</button>
          </div>
        </div>

        <div class="adjust-row">
          <div class="adjust-heading">
            <span>Cushioning</span>
            <output id="fineFirmness">50%</output>
          </div>
          <div class="stepper">
            <button data-metric="firmness" data-step="-5"
                    aria-label="Soften cushioning">−</button>
            <span>SOFT / FIRM</span>
            <button data-metric="firmness" data-step="5"
                    aria-label="Firm cushioning">+</button>
          </div>
        </div>

        <button id="resetButton" class="reset">RESET SELECTED SHOE</button>
      </div>

      <p id="sheetFeedback" class="sheet-feedback" role="status"></p>
    </section>
  </div>

  <aside id="chargingPopup" class="charging-popup" role="status" hidden>
    <span class="symbol">ϟ</span>
    <h2>Charging connected</h2>
    <p>LEFT + RIGHT</p>
  </aside>

  <div class="home-indicator" aria-hidden="true"></div>

</main>

<script>
"use strict";

const get = id => document.getElementById(id);

const state = {
  L: { arch: 50, firmness: 50, mode: null },
  R: { arch: 50, firmness: 50, mode: null }
};

const presets = {
  Walk: { arch: 40, firmness: 25 },
  Run: { arch: 60, firmness: 50 },
  Court: { arch: 75, firmness: 80 }
};

// Demonstration values, not hardware readings.
const batteryValues = { L: 82, R: 78 };

const zones = [...document.querySelectorAll(".zone")];
const modeButtons = [...document.querySelectorAll("[data-mode]")];
const sideButtons = [...document.querySelectorAll("[data-select]")];

let selected = "L";
let charging = false;
let toastTimer;
let popupTimer;
let returnFocus;

const rulerTimers = { L: null, R: null };

// Build cushion dots and ruler ticks.
for (const side of ["L", "R"]) {
  for (let i = 0; i < 10; i++) {
    const dot = document.createElement("span");
    dot.className = "dot";
    get("dots" + side).appendChild(dot);
  }

  for (let value = 0; value <= 100; value += 5) {
    const tick = document.createElement("span");
    tick.className = "tick" + (value % 25 === 0 ? " major" : "");
    tick.style.bottom = (2 + value * 2) + "px";

    if (value % 25 === 0) {
      const label = document.createElement("span");
      label.textContent = value;
      tick.appendChild(label);
    }

    get("ruler" + side).appendChild(tick);
  }
}

function clamp(value) {
  return Math.max(0, Math.min(100, Math.round(value)));
}

function sideName(side) {
  return side === "L" ? "Left" : "Right";
}

function announce(message, showToast = true) {
  get("sheetFeedback").textContent = message;

  if (!showToast || !get("sheetLayer").hidden) return;

  clearTimeout(toastTimer);
  get("toast").textContent = message;
  get("toast").hidden = false;

  toastTimer = setTimeout(() => {
    get("toast").hidden = true;
  }, 1100);
}

function showRuler(side, keepVisible = false) {
  clearTimeout(rulerTimers[side]);

  const zone = zones.find(item => item.dataset.side === side);
  zone.classList.add("show-ruler");

  if (!keepVisible) {
    rulerTimers[side] = setTimeout(() => {
      zone.classList.remove("show-ruler");
    }, 950);
  }
}

// SVG letter shapes allow smooth corner rounding without font downloads.
function renderGlyph(side, firmness) {
  const softness = 1 - firmness / 100;
  const radius = 2 + softness * 25;
  const path = get("path" + side);

  // Softer settings have thicker strokes and rounder ends.
  path.setAttribute("stroke-width", 8 + softness * 4);
  path.setAttribute("stroke-linecap", firmness < 70 ? "round" : "butt");
  path.setAttribute("stroke-linejoin", firmness < 70 ? "round" : "miter");

  if (side === "L") {
    path.setAttribute(
      "d",
      `M 24 18
       V ${130 - radius}
       Q 24 130 ${24 + radius} 130
       H 82`
    );
  } else {
    const corner = 3 + softness * 17;

    path.setAttribute(
      "d",
      `M 23 132 V 18
       H 57
       Q 82 18 82 ${18 + corner}
       V ${76 - corner}
       Q 82 76 57 76
       H 23
       M 53 76 L 84 132`
    );
  }
}

function render() {
  for (const side of ["L", "R"]) {
    const shoe = state[side];

    // Four times the previous ±18px range: now ±72px.
    const offset = (50 - shoe.arch) * 1.44;
    get("letter" + side).style.setProperty("--offset", offset + "px");

    renderGlyph(side, shoe.firmness);

    const activeDots = Math.round(shoe.firmness / 10);
    [...get("dots" + side).children].forEach((dot, index) => {
      dot.classList.toggle("on", index < activeDots);
    });

    const position = 2 + shoe.arch * 2;
    get("marker" + side).style.bottom = position + "px";
    get("rulerValue" + side).style.bottom = position + "px";
    get("rulerValue" + side).textContent = shoe.arch;

    const zone = zones.find(item => item.dataset.side === side);
    zone.classList.toggle("selected", side === selected);

    zone.setAttribute(
      "aria-label",
      `${sideName(side)} shoe. Arch ${shoe.arch} percent.
       Firmness ${shoe.firmness} percent.
       Swipe vertically for arch and horizontally for firmness.`
    );
  }

  sideButtons.forEach(button => {
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.select === selected)
    );
  });

  modeButtons.forEach(button => {
    button.setAttribute(
      "aria-pressed",
      String(state[selected].mode === button.dataset.mode)
    );
  });

  get("fineArch").textContent = state[selected].arch + "%";
  get("fineFirmness").textContent = state[selected].firmness + "%";
}

function select(side) {
  selected = side;
  render();
  announce(sideName(side) + " shoe selected", false);
}

function adjust(side, metric, value) {
  const next = clamp(value);
  if (state[side][metric] === next) return;

  state[side][metric] = next;
  state[side].mode = null;

  render();

  announce(
    sideName(side) + " " +
    (metric === "arch" ? "arch" : "firmness") +
    " · " + next + "%"
  );
}

// Independent gestures with direction locking.
zones.forEach(zone => {
  let gesture = null;

  zone.addEventListener("pointerdown", event => {
    if (!event.isPrimary || gesture) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;

    select(zone.dataset.side);

    gesture = {
      id: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      arch: state[selected].arch,
      firmness: state[selected].firmness,
      width: zone.clientWidth,
      height: zone.clientHeight,
      axis: null
    };

    zone.setPointerCapture(event.pointerId);
    zone.classList.add("dragging");
  });

  zone.addEventListener("pointermove", event => {
    if (!gesture || event.pointerId !== gesture.id) return;

    const dx = event.clientX - gesture.x;
    const dy = event.clientY - gesture.y;

    if (!gesture.axis) {
      if (Math.hypot(dx, dy) < 8) return;

      if (Math.abs(dy) > Math.abs(dx) * 1.2) {
        gesture.axis = "vertical";
      } else if (Math.abs(dx) > Math.abs(dy) * 1.2) {
        gesture.axis = "horizontal";
      } else {
        return;
      }
    }

    const side = zone.dataset.side;

    if (gesture.axis === "vertical") {
      showRuler(side, true);
      adjust(side, "arch", gesture.arch - dy / gesture.height * 100);
    } else {
      adjust(
        side,
        "firmness",
        gesture.firmness + dx / gesture.width * 100
      );
    }
  });

  function finish(event) {
    if (!gesture || event.pointerId !== gesture.id) return;

    const wasVertical = gesture.axis === "vertical";
    gesture = null;
    zone.classList.remove("dragging");

    if (zone.hasPointerCapture(event.pointerId)) {
      zone.releasePointerCapture(event.pointerId);
    }

    if (wasVertical) showRuler(zone.dataset.side);
  }

  zone.addEventListener("pointerup", finish);
  zone.addEventListener("pointercancel", finish);

  zone.addEventListener("lostpointercapture", () => {
    gesture = null;
    zone.classList.remove("dragging");

    if (zone.classList.contains("show-ruler")) {
      showRuler(zone.dataset.side);
    }
  });

  zone.addEventListener("keydown", event => {
    const actions = {
      ArrowUp: ["arch", 5],
      ArrowDown: ["arch", -5],
      ArrowRight: ["firmness", 5],
      ArrowLeft: ["firmness", -5]
    };

    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      select(zone.dataset.side);
      return;
    }

    const action = actions[event.key];
    if (!action) return;

    event.preventDefault();
    select(zone.dataset.side);

    const [metric, step] = action;
    adjust(selected, metric, state[selected][metric] + step);

    if (metric === "arch") showRuler(selected);
  });
});

// Mode / fine tune panels.
function openSheet(panel) {
  returnFocus = document.activeElement;
  const isMode = panel === "mode";

  clearTimeout(toastTimer);
  get("toast").hidden = true;

  get("sheetTitle").textContent = isMode ? "Your modes" : "Fine tune";
  get("sheetCaption").textContent = isMode
    ? "Choose a preset for the selected shoe."
    : "Adjust arch height and carbon plate firmness.";

  get("modePanel").hidden = !isMode;
  get("adjustPanel").hidden = isMode;

  render();
  announce(sideName(selected) + " shoe selected", false);

  get("sheetLayer").hidden = false;
  get("home").inert = true;
  get("closeSheet").focus();
}

function closeSheet() {
  get("sheetLayer").hidden = true;
  get("home").inert = false;
  if (returnFocus) returnFocus.focus();
}

get("modeButton").addEventListener("click", () => openSheet("mode"));
get("adjustButton").addEventListener("click", () => openSheet("adjust"));
get("closeSheet").addEventListener("click", closeSheet);
get("scrim").addEventListener("click", closeSheet);

get("controlButton").addEventListener("click", () => {
  announce(sideName(selected) + " shoe selected");
});

sideButtons.forEach(button => {
  button.addEventListener("click", () => select(button.dataset.select));
});

modeButtons.forEach(button => {
  button.addEventListener("click", () => {
    const mode = button.dataset.mode;
    Object.assign(state[selected], presets[mode], { mode });
    render();
    announce(sideName(selected) + " shoe · " + mode);
  });
});

document.querySelectorAll("[data-step]").forEach(button => {
  button.addEventListener("click", () => {
    const metric = button.dataset.metric;
    const step = Number(button.dataset.step);
    adjust(selected, metric, state[selected][metric] + step);
  });
});

get("resetButton").addEventListener("click", () => {
  Object.assign(state[selected], {
    arch: 50,
    firmness: 50,
    mode: null
  });

  render();
  announce(sideName(selected) + " shoe reset");
});

// Battery screen.
function renderBattery() {
  for (const side of ["L", "R"]) {
    const value = batteryValues[side];

    get("batteryFill" + side).style.height = value + "%";
    get("batteryPercent" + side).textContent = value + "%";
    get("batteryState" + side).textContent =
      charging ? "CHARGING" : "READY";
  }

  get("batterySummary").textContent =
    Math.round((batteryValues.L + batteryValues.R) / 2) + "%";

  get("bolt").hidden = !charging;
  get("batteryScreen").classList.toggle("charging", charging);

  get("batteryTitle").textContent =
    charging ? "Battery charging" : "Battery status";

  get("batteryCaption").textContent = charging
    ? "Your shoes are connected to power."
    : "Your shoes are ready to move.";

  get("chargeButton").textContent =
    charging ? "DISCONNECT CHARGER" : "SIMULATE CHARGING";
}

function openBattery() {
  clearTimeout(toastTimer);
  get("toast").hidden = true;
  get("home").hidden = true;
  get("batteryScreen").hidden = false;
  renderBattery();
  get("closeBattery").focus();
}

function closeBattery() {
  get("batteryScreen").hidden = true;
  get("home").hidden = false;
  get("batteryButton").focus();
}

get("batteryButton").addEventListener("click", openBattery);
get("closeBattery").addEventListener("click", closeBattery);

get("chargeButton").addEventListener("click", () => {
  charging = !charging;
  clearTimeout(popupTimer);

  renderBattery();
  get("chargingPopup").hidden = !charging;

  if (charging) {
    popupTimer = setTimeout(() => {
      get("chargingPopup").hidden = true;
    }, 2200);
  }
});

// Escape and modal keyboard focus.
document.addEventListener("keydown", event => {
  if (!get("sheetLayer").hidden) {
    if (event.key === "Escape") {
      closeSheet();
      return;
    }

    if (event.key === "Tab") {
      const buttons = [...document.querySelectorAll(".sheet button")]
        .filter(button => button.getClientRects().length > 0);

      const first = buttons[0];
      const last = buttons[buttons.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    return;
  }

  if (event.key === "Escape" && !get("batteryScreen").hidden) {
    closeBattery();
  }
});

render();
renderBattery();
</script>
</body>
</html>
