<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zhang Number Adder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER DIV -->
    <div class="header">

        <h1>Zhang Number Adder</h1>

        <div class="header-info">
            <h4>VIS 4</h4>
            <h4>Week 3</h4>
            <h4>Number Adder</h4>
        </div>

    </div>


    <div class="page-container">

        <!-- SIDEBAR DIV -->
        <div class="sidebar">

            <h3>RESULT</h3>

            <p id="resultId">0</p>

        </div>


        <!-- MAIN CONTENT DIV -->
        <div class="main-content">

            <h3>Control Center</h3>

            <div class="button-container">

                <button id="minusTwo">-2</button>

                <button id="minusOne">-1</button>

                <button id="reset">RESET</button>

                <button id="plusOne">+1</button>

                <button id="plusTwo">+2</button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
